{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Management API | எனது புத்தகம்</title>
       <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="icon" type="image/x-icon" href="{% static 'images/myicon.ico' %}">
</head>
<body>
    <div class="container-fluid  text-center bg-dark p-5 rounded">
        <h1 class="text-primary">Book Management API</h1>
        <p class="text-success">Available API Endpoints</p>
        <div class="list-group mx-auto w-100">
            {% for api in apis %}
            <a href="{{api.url}}"
            class="list-group-item list-group-item-action bg-warning">
                <strong class="badge bg-info ms-2">{{api.name}}</strong>
                <span>{{api.method}}</span>
                <span>{{api.url}}</span>
            </a>
            {% endfor %}
        </div>
    </div>
</body>
</html>
